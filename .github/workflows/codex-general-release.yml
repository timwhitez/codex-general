name: codex-general-release

on:
  push:
    tags:
      - "rust-v*.*.*"

concurrency:
  group: codex-general-release-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tag-check:
    if: ${{ github.repository == 'timwhitez/codex-general' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate tag matches Cargo.toml version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || { echo "Not a tag push"; exit 1; }
          [[ "${GITHUB_REF_NAME}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]] ||
            { echo "Tag '${GITHUB_REF_NAME}' does not match expected format"; exit 1; }

          tag_ver="${GITHUB_REF_NAME#rust-v}"
          cargo_ver="$(grep -m1 '^version' codex-rs/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          [[ "${tag_ver}" == "${cargo_ver}" ]] ||
            { echo "Tag ${tag_ver} does not match Cargo.toml ${cargo_ver}"; exit 1; }

          echo "version=${tag_ver}" >> "$GITHUB_OUTPUT"

  build-package:
    needs: tag-check
    name: Build - ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_PROFILE: release-gh
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_GH_LTO: "off"
      CARGO_PROFILE_RELEASE_GH_CODEGEN_UNITS: "16"
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux
          - label: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - label: mac-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
          - label: mac-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Print runner specs
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: ${RUNNER_OS:-unknown}"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cpu_model="$(lscpu | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
            total_ram="$(awk '/MemTotal/ {printf "%.1f GiB\n", $2 / 1024 / 1024}' /proc/meminfo)"
            echo "Kernel: $(uname -a)"
            echo "CPU model: ${cpu_model}"
            echo "Logical CPUs: $(nproc)"
            echo "Total RAM: ${total_ram}"
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            total_ram="$(sysctl -n hw.memsize | awk '{printf "%.1f GiB\n", $1 / 1024 / 1024 / 1024}')"
            echo "macOS: $(sw_vers -productName) $(sw_vers -productVersion)"
            echo "Hardware model: $(sysctl -n hw.model)"
            echo "CPU architecture: $(uname -m)"
            echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
            echo "Total RAM: ${total_ram}"
          fi
          echo "Disk usage:"
          df -h .

      - name: Install Linux build dependencies
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev zstd libubsan1

      - name: Install macOS package tools
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi

      - name: Install DotSlash
        if: ${{ matrix.platform == 'windows' }}
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Use hermetic Cargo home
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig
        if: ${{ matrix.platform == 'linux' }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: ${{ matrix.platform == 'linux' }}
        env:
          TARGET: ${{ env.TARGET }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rustc UBSan wrapper
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi

          wrapper="${RUNNER_TEMP}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - name: Clear sanitizer flags
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

          sanitize_flags() {
            local input="$1"
            input="${input//-fsanitize=undefined/}"
            input="${input//-fno-sanitize-recover=undefined/}"
            input="${input//-fno-sanitize-trap=undefined/}"
            echo "$input"
          }

          cflags="$(sanitize_flags "${CFLAGS-}")"
          cxxflags="$(sanitize_flags "${CXXFLAGS-}")"
          echo "CFLAGS=${cflags}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${cxxflags}" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        if: ${{ matrix.platform != 'windows' }}
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.TARGET }}

      - name: Build bundled bwrap
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --profile "$RELEASE_PROFILE" --timings --bin bwrap

          bwrap_path="target/${TARGET}/${RELEASE_PROFILE}/bwrap"
          test -x "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap with sha256:${digest}"

      - name: Build Codex General
        shell: bash
        run: |
          set -euo pipefail
          build_args=(--bin codex-general)
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            build_args+=(--bin codex-command-runner --bin codex-windows-sandbox-setup)
          fi

          (
            while true; do
              sleep 60
              echo "cargo build still running at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            done
          ) &
          keepalive_pid="$!"
          trap 'kill "${keepalive_pid}" 2>/dev/null || true' EXIT

          cargo_status=0
          cargo build --target "$TARGET" --profile "$RELEASE_PROFILE" --timings "${build_args[@]}" || cargo_status="$?"

          kill "${keepalive_pid}" 2>/dev/null || true
          wait "${keepalive_pid}" 2>/dev/null || true
          trap - EXIT

          if [[ "${cargo_status}" -ne 0 ]]; then
            echo "cargo build failed with status ${cargo_status}"
            if [[ "${RUNNER_OS}" == "Linux" ]]; then
              free -h || true
              df -h . || true
              ps -eo pid,ppid,stat,pcpu,pmem,rss,comm,args --sort=-rss | head -40 || true
            fi
            exit "${cargo_status}"
          fi

      - name: Upload Cargo timings
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-general-cargo-timings-${{ matrix.target }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          exe_suffix=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            exe_suffix=".exe"
          fi

          binary="target/${TARGET}/${RELEASE_PROFILE}/codex-general${exe_suffix}"
          "$binary" --version
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            test -x "target/${TARGET}/${RELEASE_PROFILE}/bwrap"
          fi

      - name: Build installer package archives
        shell: bash
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$TARGET" \
            --bundle primary \
            --entrypoint-dir "target/${TARGET}/${RELEASE_PROFILE}" \
            --cargo-profile "$RELEASE_PROFILE" \
            --archive-dir "dist/${TARGET}"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-general-${{ matrix.target }}
          path: codex-rs/dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    needs:
      - tag-check
      - build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-general-x86_64-unknown-linux-musl
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-general-x86_64-pc-windows-msvc
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-general-x86_64-apple-darwin
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-general-aarch64-apple-darwin
          path: dist

      - name: Stage release assets
        shell: bash
        env:
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          cp scripts/install/install.sh dist/install.sh
          cp scripts/install/install.ps1 dist/install.ps1

          (
            cd dist
            sha256sum codex-package-*.tar.gz > codex-package_SHA256SUMS
            sha256sum * > SHA256SUMS
          )

          cat > release-notes.md <<EOF
          Codex General ${VERSION}

          Built by GitHub Actions from ${GITHUB_SHA}.

          Platform package assets in this fork release:
          - codex-package-x86_64-unknown-linux-musl.tar.gz
          - codex-package-x86_64-pc-windows-msvc.tar.gz
          - codex-package-x86_64-apple-darwin.tar.gz
          - codex-package-aarch64-apple-darwin.tar.gz
          - Matching .tar.zst archives
          - install.sh / install.ps1
          - SHA-256 checksum manifests
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: Codex General ${{ needs.tag-check.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
